name: Validate CNC RFQ app

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m py_compile app.py geometry.py estimate.py rfq.py

      - name: Check JSON configuration
        run: python -c "import json; json.load(open('config.json', encoding='utf-8'))"

      - name: Check OpenCascade import
        run: |
          python -m pip install --disable-pip-version-check --no-input cadquery-ocp==7.8.1.1
          python -c "from OCP.STEPControl import STEPControl_Reader; print('OpenCascade import OK')"
